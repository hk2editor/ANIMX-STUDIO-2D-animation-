<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Animix Studio - Canvas Workspace</title>
    <style>
        :root {
            --bg-color: #200000;
            --main-red: #ff0000;
            --dark-red: #800000;
            --panel-bg: rgba(20, 5, 5, 0.95);
            --text-white: #ffffff;
            --shadow-glow: rgba(255, 0, 0, 0.4);
        }

        body.theme-blue {
            --bg-color: #001122;
            --main-red: #00d2ff;
            --dark-red: #005577;
            --panel-bg: rgba(5, 15, 30, 0.95);
            --shadow-glow: rgba(0, 210, 255, 0.4);
        }

        body.theme-gray {
            --bg-color: #1a1a1a;
            --main-red: #aaaaaa;
            --dark-red: #555555;
            --panel-bg: rgba(30, 30, 30, 0.95);
            --shadow-glow: rgba(255, 255, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        .top-bar {
            height: 50px;
            background: rgba(0,0,0,0.6);
            border-bottom: 2px solid var(--main-red);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-shadow: 0 2px 10px var(--shadow-glow);
        }

        .project-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--main-red);
        }

        .top-actions {
            display: flex;
            gap: 10px;
        }

        .top-btn {
            background: #111;
            color: #fff;
            border: 1px solid var(--main-red);
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .main-workspace {
            flex: 1;
            display: flex;
            position: relative;
            height: calc(100vh - 170px);
        }

        .toolbox {
            width: 55px;
            background: rgba(0,0,0,0.5);
            border-right: 2px solid var(--main-red);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 0;
            gap: 12px;
        }

        .tool-btn {
            width: 40px;
            height: 40px;
            border: 2px solid var(--dark-red);
            background: #111;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
        }

        .tool-btn.active {
            border-color: var(--main-red);
            background: var(--dark-red);
            box-shadow: 0 0 8px var(--main-red);
        }

        .color-picker-wrapper {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #fff;
            overflow: hidden;
            position: relative;
        }
        .color-picker-wrapper input[type="color"] {
            position: absolute;
            top: -5px; left: -5px; width: 50px; height: 50px;
            cursor: pointer;
        }

        .canvas-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2b2b2b;
            position: relative;
            overflow: hidden;
        }

        .canvas-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 2px solid #555;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #onion-canvas {
            opacity: 0.35;
            pointer-events: none;
        }

        #main-canvas {
            background: #ffffff;
            z-index: 2;
        }

        .timeline-section {
            height: 120px;
            background: rgba(0,0,0,0.7);
            border-top: 2px solid var(--main-red);
            display: flex;
            flex-direction: column;
            padding: 5px;
            box-shadow: 0 -2px 10px var(--shadow-glow);
        }

        .timeline-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 10px;
            border-bottom: 1px solid #333;
        }

        .layer-info {
            font-size: 12px;
            color: var(--main-red);
        }

        .frame-controls {
            display: flex;
            gap: 8px;
        }

        .frame-strip {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            padding: 8px 10px;
        }

        .frame-card {
            width: 50px;
            height: 50px;
            background: #222;
            border: 2px solid var(--dark-red);
            border-radius: 4px;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            color: #aaa;
        }

        .frame-card.active {
            border-color: var(--main-red);
            background: #400;
            color: #fff;
            box-shadow: 0 0 5px var(--main-red);
        }

        body.theme-blue .frame-card.active { background: #003355; }
        body.theme-gray .frame-card.active { background: #444444; }

        .frame-card span {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 9px;
        }
    </style>
</head>
<body class="landscape" id="app-body">

    <div class="top-bar">
        <button class="top-btn" onclick="goBackHome()">⬅ HOME</button>
        <div class="project-title" id="active-title">ANIMIX WORKSPACE</div>
        <div class="top-actions">
            <button class="top-btn" onclick="toggleOnionSkin()">🧅 Onion Skin: <span id="onion-status">OFF</span></button>
            <button class="top-btn" style="background: green; border-color: #0f0;" onclick="playStopAnimation(event)">▶ PLAY</button>
        </div>
    </div>

    <div class="main-workspace">
        <div class="toolbox">
            <button class="tool-btn active" id="tool-pen" onclick="setTool('pen')">PEN</button>
            <button class="tool-btn" id="tool-eraser" onclick="setTool('eraser')">ERAS</button>
            <button class="tool-btn" id="tool-bucket" onclick="setTool('bucket')">FILL</button>
            <hr style="width:70%; border-color: var(--dark-red);">
            <input type="range" id="brush-size" min="2" max="25" value="6" style="width:40px; accent-color: var(--main-red);">
            <div class="color-picker-wrapper">
                <input type="color" id="brush-color" value="#000000">
            </div>
            <hr style="width:70%; border-color: var(--dark-red);">
            <button class="tool-btn" style="height:30px; font-size:10px;" onclick="clearCurrentFrame()">CLR</button>
        </div>

        <div class="canvas-area">
            <div class="canvas-container">
                <canvas id="onion-canvas"></canvas>
                <canvas id="main-canvas"></canvas>
            </div>
        </div>
    </div>

    <div class="timeline-section">
        <div class="timeline-top">
            <div class="layer-info">🎬 Layer 1 (Timeline Sheet)</div>
            <div class="frame-controls">
                <button class="top-btn" style="padding:2px 8px; font-size:11px;" onclick="insertNewBlankFrame()">➕ ADD FRAME</button>
                <button class="top-btn" style="padding:2px 8px; font-size:11px; background:#500;" onclick="deleteCurrentFrame()">❌ DEL</button>
            </div>
        </div>
        <div class="frame-strip" id="frame-strip-container"></div>
    </div>

    <script>
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const onionCanvas = document.getElementById('onion-canvas');
        const oCtx = onionCanvas.getContext('2d');

        let framesData = []; 
        let currentFrameIndex = 0;
        let activeTool = 'pen';
        let isDrawing = false;
        let onionSkinActive = false;
        let isPlaying = false;
        let playInterval = null;
        window.animationSpeedFPS = 24;

        window.onload = function() {
            // Theme setup
            const savedTheme = localStorage.getItem('animix-global-theme');
            const body = document.getElementById('app-body');
            body.classList.remove('theme-blue', 'theme-gray');
            if(savedTheme === 'blue') body.classList.add('theme-blue');
            if(savedTheme === 'gray') body.classList.add('theme-gray');
            
            // Dynamic Project Configurations Setup
            const activeName = localStorage.getItem('animix-active-name') || "Untitled";
            const activeSize = localStorage.getItem('animix-active-size') || "1920x1080";
            const activeFps = localStorage.getItem('animix-active-fps') || "24";

            document.getElementById('active-title').innerText = `${activeName.toUpperCase()} (${activeFps} FPS)`;
            window.animationSpeedFPS = parseInt(activeFps);

            const canvasContainer = document.querySelector('.canvas-container');
            const dimensions = activeSize.split('x');
            const targetWidth = parseInt(dimensions[0]) || 1920;
            const targetHeight = parseInt(dimensions[1]) || 1080;

            canvas.width = targetWidth;
            canvas.height = targetHeight;
            onionCanvas.width = targetWidth;
            onionCanvas.height = targetHeight;

            if (targetWidth > targetHeight) {
                canvasContainer.style.width = "450px";
                canvasContainer.style.height = (450 * (targetHeight / targetWidth)) + "px";
            } else {
                canvasContainer.style.height = "320px";
                canvasContainer.style.width = (320 * (targetWidth / targetHeight)) + "px";
            }

            initCanvasEngine();
            setupInitialFrames();
        };

        function initCanvasEngine() {
            const startDraw = (e) => {
                if(activeTool === 'bucket') {
                    executeBucketFill(document.getElementById('brush-color').value);
                    return;
                }
                isDrawing = true;
                ctx.beginPath();
                const pos = getCoordinates(e);
                ctx.moveTo(pos.x, pos.y);
            };

            const drawAction = (e) => {
                if (!isDrawing || activeTool === 'bucket') return;
                const pos = getCoordinates(e);
                ctx.lineWidth = document.getElementById('brush-size').value;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                if (activeTool === 'pen') {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = document.getElementById('brush-color').value;
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                } else if (activeTool === 'eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                }
            };

            const stopDraw = () => {
                if(isDrawing) {
                    isDrawing = false;
                    ctx.closePath();
                    saveCurrentFrameState();
                }
            };

            canvas.addEventListener('mousedown', startDraw);
            canvas.addEventListener('mousemove', drawAction);
            canvas.addEventListener('mouseup', stopDraw);

            canvas.addEventListener('touchstart', (e) => { startDraw(e.touches[0]); e.preventDefault(); });
            canvas.addEventListener('touchmove', (e) => { drawAction(e.touches[0]); e.preventDefault(); });
            canvas.addEventListener('touchend', stopDraw);
        }

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function executeBucketFill(fillHex) {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = fillHex;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            saveCurrentFrameState();
        }

        function setupInitialFrames() {
            insertNewBlankFrame();
            switchActiveFrame(0);
        }

        function insertNewBlankFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const blankCanvasState = canvas.toDataURL();
            framesData.push(blankCanvasState);
            renderTimelineStrip();
            switchActiveFrame(framesData.length - 1);
        }

        function renderTimelineStrip() {
            const strip = document.getElementById('frame-strip-container');
            strip.innerHTML = "";
            framesData.forEach((frame, idx) => {
                const card = document.createElement('div');
                card.className = `frame-card ${idx === currentFrameIndex ? 'active' : ''}`;
                card.onclick = () => { switchActiveFrame(idx); };
                card.innerHTML = `<span>#${idx + 1}</span>🎞️`;
                strip.appendChild(card);
            });
        }

        function switchActiveFrame(targetIndex) {
            if(targetIndex < 0 || targetIndex >= framesData.length) return;
            currentFrameIndex = targetIndex;
            renderTimelineStrip();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'source-over';

            const img = new Image();
            img.src = framesData[currentFrameIndex];
            img.onload = () => {
                ctx.drawImage(img, 0, 0);
                drawOnionSkinLayer();
            };
        }

        function saveCurrentFrameState() {
            framesData[currentFrameIndex] = canvas.toDataURL();
        }

        function deleteCurrentFrame() {
            if(framesData.length <= 1) return;
            framesData.splice(currentFrameIndex, 1);
            switchActiveFrame(currentFrameIndex > 0 ? currentFrameIndex - 1 : 0);
        }

        function clearCurrentFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            saveCurrentFrameState();
        }

        function toggleOnionSkin() {
            onionSkinActive = !onionSkinActive;
            document.getElementById('onion-status').innerText = onionSkinActive ? "ON" : "OFF";
            document.getElementById('onion-status').style.color = onionSkinActive ? "#0f0" : "#ff0000";
            drawOnionSkinLayer();
        }

        function drawOnionSkinLayer() {
            oCtx.clearRect(0, 0, onionCanvas.width, onionCanvas.height);
            if (onionSkinActive && currentFrameIndex > 0) {
                const prevImg = new Image();
                prevImg.src = framesData[currentFrameIndex - 1];
                prevImg.onload = () => { oCtx.drawImage(prevImg, 0, 0); };
            }
        }

        function playStopAnimation(event) {
            const playBtn = event.target;
            const currentFPS = window.animationSpeedFPS || 24;
            if(isPlaying) {
                isPlaying = false;
                playBtn.innerText = "▶ PLAY";
                playBtn.style.background = "green";
                clearInterval(playInterval);
            } else {
                isPlaying = true;
                playBtn.innerText = "⏸ STOP";
                playBtn.style.background = "orange";
                let playbackIdx = 0;
                playInterval = setInterval(() => {
                    switchActiveFrame(playbackIdx);
                    playbackIdx++;
                    if(playbackIdx >= framesData.length) playbackIdx = 0;
                }, 1000 / currentFPS);
            }
        }

        function setTool(toolName) {
            activeTool = toolName;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tool-${toolName}`).classList.add('active');
        }

        function goBackHome() { window.location.href = "index.html"; }
    </script>
</body>
    </html>
