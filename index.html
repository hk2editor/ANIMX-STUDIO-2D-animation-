<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Animix Studio - Home</title>
    <style>
        :root {
            --bg-color: #200000;
            --main-red: #ff0000;
            --dark-red: #800000;
            --text-white: #ffffff;
            --shadow-glow: rgba(255, 0, 0, 0.6);
        }
        body.theme-blue {
            --bg-color: #001122;
            --main-red: #00d2ff;
            --dark-red: #005577;
            --text-white: #ffffff;
            --shadow-glow: rgba(0, 210, 255, 0.6);
        }
        body.theme-gray {
            --bg-color: #1a1a1a;
            --main-red: #aaaaaa;
            --dark-red: #555555;
            --text-white: #ffffff;
            --shadow-glow: rgba(255, 255, 255, 0.3);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', Gadget, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            transition: background 0.3s ease;
        }
        body.landscape .projects-container {
            flex-direction: row;
            overflow-x: auto;
            width: 100%;
            max-width: 850px;
            padding: 20px;
        }
        body.portrait .projects-container {
            flex-direction: column;
            overflow-y: auto;
            width: 100%;
            max-width: 400px;
            height: 350px;
            padding: 20px;
        }
        .controls-bar {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 10px;
        }
        .toggle-ui-btn {
            background: #111;
            color: #fff;
            border: 2px solid var(--main-red);
            padding: 8px 15px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--shadow-glow);
        }
        .header {
            text-align: center;
            margin: 15px 0;
        }
        .logo-box {
            border: 4px solid var(--main-red);
            padding: 5px 25px;
            background-color: rgba(0,0,0,0.5);
            box-shadow: 0 0 15px var(--shadow-glow);
        }
        .logo-main {
            font-size: 34px;
            color: var(--main-red);
            letter-spacing: 2px;
            text-shadow: 2px 2px #000;
        }
        .logo-sub {
            font-size: 13px;
            color: var(--main-red);
            display: block;
            margin-top: -5px;
            letter-spacing: 5px;
        }
        .top-nav {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            margin: 20px 0;
        }
        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-white);
            cursor: pointer;
            text-align: center;
            padding: 10px;
        }
        .nav-btn span {
            display: block;
            font-size: 14px;
            color: var(--main-red);
            margin-bottom: 8px;
            text-shadow: 1px 1px #000;
        }
        .icon-circle {
            width: 65px;
            height: 65px;
            border: 4px solid var(--main-red);
            border-radius: 50%;
            background: rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 12px var(--shadow-glow);
            margin: 0 auto;
        }
        .line {
            width: 26px;
            height: 4px;
            background-color: var(--main-red);
            margin: 3px 0;
            border-radius: 2px;
        }
        .plus {
            font-size: 38px;
            color: var(--main-red);
            line-height: 1;
        }
        .projects-section {
            width: 100%;
            text-align: center;
            margin-top: 15px;
        }
        .projects-title {
            font-size: 24px;
            text-transform: uppercase;
            border-bottom: 3px solid var(--text-white);
            display: inline-block;
            padding-bottom: 4px;
            margin-bottom: 20px;
            text-shadow: 2px 2px #000;
        }
        .projects-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 25px;
            scrollbar-width: none;
            margin: 0 auto;
        }
        .projects-container::-webkit-scrollbar {
            display: none;
        }
        .project-card {
            border: 4px solid var(--main-red);
            border-radius: 15px;
            width: 170px;
            height: 110px;
            position: relative;
            flex-shrink: 0;
            cursor: pointer;
            background-image: linear-gradient(to bottom, #73a9c2 55%, #5c3a21 55%, #5c3a21 75%, #3d2314 75%);
            background-size: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .project-card:active {
            transform: scale(0.92);
        }
        .project-name-tag {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 11px;
            padding: 4px 0;
            text-align: center;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            display: none; 
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: #250505;
            border: 4px solid var(--main-red);
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 25px var(--shadow-glow);
        }
        body.theme-blue .modal-box { background: #051525; }
        body.theme-gray .modal-box { background: #222222; }
        .modal-box h2 {
            color: var(--main-red);
            text-align: center;
            font-size: 20px;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--main-red);
            padding-bottom: 5px;
        }
        .field-group {
            margin-bottom: 12px;
        }
        .field-group label {
            display: block;
            font-size: 13px;
            color: #ccc;
            margin-bottom: 4px;
        }
        .field-group input, .field-group select {
            width: 100%;
            padding: 9px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--dark-red);
            color: #fff;
            border-radius: 6px;
            font-size: 13px;
        }
        .custom-wh-inputs {
            display: none;
            gap: 10px;
            margin-top: 8px;
        }
        .custom-wh-inputs div {
            flex: 1;
        }
        .action-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 18px;
            gap: 10px;
        }
        .panel-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--main-red);
            background: transparent;
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .panel-btn-submit {
            background: var(--main-red);
        }
        .panel-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="landscape" id="app-body">

    <div class="controls-bar">
        <button class="toggle-ui-btn" id="ui-toggle-btn" onclick="uiLayoutToggle()">UI Mode: Horizontal</button>
    </div>

    <div class="header">
        <div class="logo-box">
            <span class="logo-main">ANIMIX</span>
            <span class="logo-sub">STUDIO</span>
        </div>
    </div>

    <div class="top-nav">
        <button class="nav-btn" onclick="openPopupPanel('settings-popup')">
            <span>SETTING</span>
            <div class="icon-circle">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
        </button>

        <button class="nav-btn" onclick="openPopupPanel('create-popup')">
            <span>CREATE</span>
            <div class="icon-circle">
                <div class="plus">+</div>
            </div>
        </button>
    </div>

    <div class="projects-section">
        <h2 class="projects-title">Projects File Folder</h2>
        <div class="projects-container" id="folder-list">
            </div>
    </div>

    <div class="modal-overlay" id="create-popup">
        <div class="modal-box">
            <h2>NEW ANIMATION PROJECT</h2>
            <div class="field-group">
                <label>Enter Project Name:</label>
                <input type="text" id="input-proj-name" placeholder="My New Anime 2D">
            </div>
            <div class="field-group">
                <label>Select Animation Speed (FPS):</label>
                <select id="input-proj-fps">
                    <option value="12">12 FPS (Cartoon style)</option>
                    <option value="24" selected>24 FPS (Anime Standard)</option>
                    <option value="30">30 FPS (Smooth Digital)</option>
                </select>
            </div>
            <div class="field-group">
                <label>Select Canvas Size Template:</label>
                <select id="input-proj-res" onchange="toggleCustomFields(this.value)">
                    <option value="1920x1080">1920x1080 (Full HD YouTube)</option>
                    <option value="1280x720">1280x720 (Standard HD)</option>
                    <option value="1080x1920">1080x1920 (TikTok / Reels Vertical)</option>
                    <option value="custom-option">⚙️ Custom Size Layout</option>
                </select>
                <div class="custom-wh-inputs" id="custom-resolution-box">
                    <div>
                        <label>Width (px):</label>
                        <input type="number" id="custom-w-val" value="1080">
                    </div>
                    <div>
                        <label>Height (px):</label>
                        <input type="number" id="custom-height-val" value="1080">
                    </div>
                </div>
            </div>
            <div class="action-buttons">
                <button class="panel-btn" onclick="closePopupPanel('create-popup')">CANCEL</button>
                <button class="panel-btn panel-btn-submit" onclick="executeCreateProject()">CREATE & EXIT</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settings-popup">
        <div class="modal-box">
            <h2>ANIMATION STUDIO SETTINGS</h2>
            <div class="field-group">
                <label>Change App Skin Theme Color:</label>
                <select id="select-app-theme">
                    <option value="default">Crimson Dark Red (Default)</option>
                    <option value="blue">Neon Blue Cyber Edition</option>
                    <option value="gray">Classic Mechanic Dark Gray</option>
                </select>
            </div>
            <div class="action-buttons">
                <button class="panel-btn panel-btn-submit" style="width: 100%;" onclick="executeApplySettings()">SAVE & APPLY CHANGES</button>
            </div>
        </div>
    </div>

    <script>
        // LocalStorage system to persistent keep project list
        let animixProjects = JSON.parse(localStorage.getItem('animix_projects_list')) || [
            { id: "p1", name: 'Action Fight Scene', size: '1920x1080', fps: '24' },
            { id: "p2", name: 'Stickman Jump Walk', size: '1280x720', fps: '12' }
        ];

        window.onload = function() {
            // Apply saved Theme
            const savedTheme = localStorage.getItem('animix-global-theme');
            const body = document.getElementById('app-body');
            if(savedTheme === 'blue') {
                body.className = "landscape theme-blue";
                document.getElementById('select-app-theme').value = "blue";
            } else if(savedTheme === 'gray') {
                body.className = "landscape theme-gray";
                document.getElementById('select-app-theme').value = "gray";
            }
            renderProjects();
        };

        function renderProjects() {
            const targetFolder = document.getElementById('folder-list');
            targetFolder.innerHTML = "";
            animixProjects.forEach(proj => {
                const cardElement = document.createElement('div');
                cardElement.className = "project-card";
                cardElement.onclick = function() { triggerOpenWorkspace(proj.id, proj.name, proj.size, proj.fps); };

                const tagElement = document.createElement('div');
                tagElement.className = "project-name-tag";
                tagElement.innerHTML = `${proj.name}<br><small>${proj.size} (${proj.fps} FPS)</small>`;

                cardElement.appendChild(tagElement);
                targetFolder.appendChild(cardElement);
            });
            localStorage.setItem('animix_projects_list', JSON.stringify(animixProjects));
        }

        function uiLayoutToggle() {
            const body = document.getElementById('app-body');
            const toggleButton = document.getElementById('ui-toggle-btn');
            if (body.classList.contains('landscape')) {
                body.classList.remove('landscape');
                body.classList.add('portrait');
                toggleButton.innerText = "UI Mode: Vertical";
            } else {
                body.classList.remove('portrait');
                body.classList.add('landscape');
                toggleButton.innerText = "UI Mode: Horizontal";
            }
        }

        function openPopupPanel(id) { document.getElementById(id).style.display = "flex"; }
        function closePopupPanel(id) { document.getElementById(id).style.display = "none"; }
        function toggleCustomFields(selectedValue) {
            document.getElementById('custom-resolution-box').style.display = (selectedValue === "custom-option") ? "flex" : "none";
        }

        function executeApplySettings() {
            const themeValue = document.getElementById('select-app-theme').value;
            const body = document.getElementById('app-body');
            localStorage.setItem('animix-global-theme', themeValue);
            body.classList.remove('theme-blue', 'theme-gray');
            if (themeValue === "blue") body.classList.add('theme-blue');
            if (themeValue === "gray") body.classList.add('theme-gray');
            closePopupPanel('settings-popup');
        }

        function executeCreateProject() {
            const projNameInput = document.getElementById('input-proj-name').value.trim();
            const finalName = projNameInput ? projNameInput : "New Project";
            const fpsValue = document.getElementById('input-proj-fps').value;
            const resTemplate = document.getElementById('input-proj-res').value;

            let resolutionText = resTemplate;
            if (resTemplate === "custom-option") {
                const w = document.getElementById('custom-w-val').value || "1080";
                const h = document.getElementById('custom-height-val').value || "1080";
                resolutionText = `${w}x${h}`;
            }

            const newId = "proj_" + Date.now();
            animixProjects.push({ id: newId, name: finalName, size: resolutionText, fps: fpsValue });
            renderProjects();

            document.getElementById('input-proj-name').value = "";
            closePopupPanel('create-popup');
        }

        function triggerOpenWorkspace(id, name, size, fps) {
            localStorage.setItem('animix-active-id', id);
            localStorage.setItem('animix-active-name', name);
            localStorage.setItem('animix-active-size', size);
            localStorage.setItem('animix-active-fps', fps);
            window.location.href = "project.html";
        }
    </script>
</body>
</html>
