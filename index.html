<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Animix Studio - Home</title>

<style>
:root {
  --bg: #120000;
  --main: #ff0000;
  --shadow: rgba(255, 0, 0, .45);
  --text: #fff;
}

body.theme-blue {
  --bg: #00131d;
  --main: #00d2ff;
  --shadow: rgba(0, 210, 255, .4);
}

body.theme-gray {
  --bg: #1a1a1a;
  --main: #bbbbbb;
  --shadow: rgba(255, 255, 255, .25);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial Black, sans-serif;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
}

body {
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  overflow-x: hidden;
  animation: fadeIn 0.5s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

.header {
  margin-top: 10px;
  text-align: center;
}

.logo-box {
  border: 4px solid var(--main);
  padding: 8px 25px;
  box-shadow: 0 0 20px var(--shadow);
  animation: pulse 2s infinite alternate;
}

@keyframes pulse {
  0% { box-shadow: 0 0 15px var(--shadow); }
  100% { box-shadow: 0 0 25px var(--shadow); border-color: var(--main); }
}

.logo-main {
  font-size: 34px;
  color: var(--main);
  display: block;
  letter-spacing: 3px;
}

.logo-sub {
  font-size: 12px;
  letter-spacing: 6px;
  color: var(--main);
}

.top-nav {
  display: flex;
  gap: 45px;
  margin-top: 25px;
}

.nav-btn {
  background: none;
  border: none;
  color: #fff;
  cursor: pointer;
}

.nav-btn span {
  display: block;
  color: var(--main);
  margin-bottom: 8px;
  font-size: 14px;
}

.icon-circle {
  width: 70px;
  height: 70px;
  border: 4px solid var(--main);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 12px var(--shadow);
  background: rgba(0, 0, 0, .4);
}

.nav-btn:hover .icon-circle {
  transform: scale(1.1);
  box-shadow: 0 0 20px var(--main);
}

.plus {
  font-size: 42px;
  color: var(--main);
}

.line {
  width: 28px;
  height: 4px;
  background: var(--main);
  margin: 3px 0;
  border-radius: 3px;
}

.projects-title {
  margin-top: 30px;
  margin-bottom: 15px;
  font-size: 22px;
  border-bottom: 2px solid #fff;
  padding-bottom: 4px;
}

.projects-container {
  width: 100%;
  max-width: 420px;
  height: 330px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
  padding: 5px;
}

.projects-container::-webkit-scrollbar {
  display: none;
}

.project-card {
  height: 100px;
  border: 3px solid var(--main);
  border-radius: 12px;
  background: linear-gradient(#6aa4bf 55%, #5b3920 55%);
  position: relative;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(0, 0, 0, .5);
  animation: slideUp 0.4s ease-out both;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.project-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 5px 15px var(--shadow);
}

.project-card:active {
  transform: scale(.97);
}

.project-name {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  background: rgba(0, 0, 0, .7);
  padding: 6px;
  font-size: 12px;
  text-align: center;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-left: 15px;
  padding-right: 15px;
}

.project-info {
  text-align: left;
  line-height: 1.4;
}

.delete-btn {
  background: #ff3333;
  color: white;
  border: none;
  border-radius: 4px;
  padding: 6px 10px;
  font-size: 11px;
  cursor: pointer;
  font-family: Arial, sans-serif;
  font-weight: bold;
  z-index: 10;
}

.delete-btn:hover {
  background: #ff0000;
  transform: scale(1.05);
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .85);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.modal.show {
  display: flex;
  opacity: 1;
}

.modal-box {
  width: 90%;
  max-width: 400px;
  background: #200000;
  border: 3px solid var(--main);
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 20px var(--shadow);
  transform: scale(0.7);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.modal.show .modal-box {
  transform: scale(1);
}

body.theme-blue .modal-box { background: #051b28; }
body.theme-gray .modal-box { background: #2a2a2a; }
body.theme-custom .modal-box { background: #181818; }

.modal-box h2 {
  text-align: center;
  color: var(--main);
  margin-bottom: 20px;
}

.field {
  margin-bottom: 15px;
}

.field label {
  display: block;
  margin-bottom: 5px;
  font-size: 13px;
}

.field input,
.field select {
  width: 100%;
  padding: 10px;
  background: #111;
  border: 2px solid var(--main);
  color: #fff;
  border-radius: 6px;
  outline: none;
}

.field input[type="color"] {
  height: 45px;
  padding: 5px;
  cursor: pointer;
}

.custom-row {
  display: none;
  gap: 8px;
  margin-top: 8px;
}

.custom-row input {
  width: 50%;
}

.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.btn {
  flex: 1;
  padding: 10px;
  border: none;
  cursor: pointer;
  border-radius: 6px;
  font-weight: bold;
}

.btn-red {
  background: var(--main);
  color: #000;
}

.btn-red:hover {
  filter: brightness(1.2);
}

.btn-dark {
  background: #111;
  color: #fff;
  border: 1px solid var(--main);
}

.btn-dark:hover {
  background: #222;
}
</style>
</head>
<body id="app-body">

<div class="header">
  <div class="logo-box">
    <span class="logo-main">ANIMIX</span>
    <span class="logo-sub">STUDIO</span>
  </div>
</div>

<div class="top-nav">
  <button class="nav-btn" onclick="openModal('settingsModal')">
    <span>SETTING</span>
    <div class="icon-circle">
      <div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
      </div>
    </div>
  </button>

  <button class="nav-btn" onclick="openModal('createModal')">
    <span>CREATE</span>
    <div class="icon-circle">
      <div class="plus">+</div>
    </div>
  </button>

  <button class="nav-btn" onclick="document.getElementById('aniImport').click()">
    <span>IMPORT</span>
    <div class="icon-circle">
      <div class="plus">↓</div>
    </div>
  </button>

  <input type="file" id="aniImport" accept=".ani" style="display:none" onchange="importAniFile(event)">
</div>

<h2 class="projects-title">Projects</h2>
<div class="projects-container" id="projectsList"></div>

<div class="modal" id="createModal">
  <div class="modal-box">
    <h2>Create New Project</h2>

    <div class="field">
      <label>Project Name</label>
      <input id="projectName" placeholder="My Animation">
    </div>

    <div class="field">
      <label>FPS</label>
      <select id="projectFPS" onchange="toggleCustomFPS(this.value)">
        <option value="12">12</option>
        <option value="24" selected>24</option>
        <option value="30">30</option>
        <option value="60">60</option>
        <option value="custom">Custom FPS</option>
      </select>

      <input id="customFPS" type="number" placeholder="Enter custom FPS" style="display:none;margin-top:8px;" min="1" max="240">
    </div>

    <div class="field">
      <label>Canvas Size</label>
      <select id="projectSize" onchange="toggleCustomCanvas(this.value)">
        <option value="1920x1080">1920x1080</option>
        <option value="1280x720">1280x720</option>
        <option value="1080x1920">1080x1920</option>
        <option value="custom">Custom Size</option>
      </select>

      <div class="custom-row" id="customCanvasBox">
        <input id="customWidth" type="number" placeholder="Width" min="1">
        <input id="customHeight" type="number" placeholder="Height" min="1">
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-dark" onclick="closeModal('createModal')">Cancel</button>
      <button class="btn btn-red" onclick="createProject()">Create</button>
    </div>
  </div>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-box">
    <h2>App Settings</h2>

    <div class="field">
      <label>Theme Preset</label>
      <select id="themeSelect" onchange="toggleCustomColorView(this.value)">
        <option value="default">Default Red</option>
        <option value="blue">Blue</option>
        <option value="gray">Gray</option>
        <option value="custom">Custom Color</option>
      </select>
    </div>

    <div class="field" id="customColorField" style="display: none;">
      <label>Pick Your Custom Color</label>
      <input type="color" id="customThemeColor" value="#ff00ff">
    </div>

    <div class="btn-row">
      <button class="btn btn-dark" onclick="closeModal('settingsModal')">Cancel</button>
      <button class="btn btn-red" onclick="saveTheme()">Save</button>
    </div>
  </div>
</div>

<script>
let projects = JSON.parse(localStorage.getItem('animix_projects_list')) || [];

window.onload = function() {
  loadTheme();
  renderProjects();
};

function loadTheme() {
  let saved = localStorage.getItem('animix-global-theme');
  let customColor = localStorage.getItem('animix-custom-color');
  let body = document.getElementById('app-body');

  body.classList.remove('theme-blue', 'theme-gray', 'theme-custom');
  body.removeAttribute('style');

  if (saved === "blue") body.classList.add('theme-blue');
  if (saved === "gray") body.classList.add('theme-gray');
  
  if (saved === "custom" && customColor) {
    body.classList.add('theme-custom');
    body.style.setProperty('--bg', '#121212');
    body.style.setProperty('--main', customColor);
    body.style.setProperty('--shadow', customColor + '66'); // Adds transperancy for shadow
  }

  document.getElementById('themeSelect').value = saved || "default";
  if (customColor) document.getElementById('customThemeColor').value = customColor;
  toggleCustomColorView(saved || "default");
}

function toggleCustomColorView(val) {
  document.getElementById('customColorField').style.display = (val === 'custom') ? 'block' : 'none';
}

function saveTheme() {
  let val = document.getElementById('themeSelect').value;
  localStorage.setItem('animix-global-theme', val);

  if (val === 'custom') {
    let colorPicked = document.getElementById('customThemeColor').value;
    localStorage.setItem('animix-custom-color', colorPicked);
  }

  loadTheme();
  closeModal('settingsModal');
}

function openModal(id) {
  let modal = document.getElementById(id);
  modal.style.display = "flex";
  setTimeout(() => modal.classList.add('show'), 10);
}

function closeModal(id) {
  let modal = document.getElementById(id);
  modal.classList.remove('show');
  setTimeout(() => modal.style.display = "none", 300);
}

function toggleCustomFPS(v) {
  document.getElementById('customFPS').style.display = v === "custom" ? "block" : "none";
}

function toggleCustomCanvas(v) {
  document.getElementById('customCanvasBox').style.display = v === "custom" ? "flex" : "none";
}

function createProject() {
  let name = document.getElementById('projectName').value.trim() || "New Project";
  let fps = document.getElementById('projectFPS').value;
  if (fps === "custom") {
    fps = document.getElementById('customFPS').value || "24";
  }

  let size = document.getElementById('projectSize').value;
  if (size === "custom") {
    let w = document.getElementById('customWidth').value || "1080";
    let h = document.getElementById('customHeight').value || "1080";
    size = w + "x" + h;
  }

  let project = {
    id: "proj_" + Date.now(),
    name: name,
    fps: fps,
    size: size,
    frames: [],
    layers: [],
    audio: null
  };

  projects.push(project);
  localStorage.setItem('animix_projects_list', JSON.stringify(projects));
  
  localStorage.setItem('animix-active-id', project.id);
  localStorage.setItem('animix-active-name', project.name);
  localStorage.setItem('animix-active-fps', project.fps);
  localStorage.setItem('animix-active-size', project.size);

  window.location.href = "project.html";
}

function renderProjects() {
  let box = document.getElementById('projectsList');
  box.innerHTML = "";

  projects.forEach((p, index) => {
    let card = document.createElement('div');
    card.className = 'project-card';
    card.style.animationDelay = (index * 0.05) + 's'; // Staggered entry animation
    
    card.onclick = (e) => {
      // Don't open project if user clicks the delete button
      if(e.target.classList.contains('delete-btn')) return;
      openProject(p.id);
    };

    let label = document.createElement('div');
    label.className = 'project-name';

    let infoWrapper = document.createElement('div');
    infoWrapper.className = 'project-info';
    infoWrapper.innerHTML = `${p.name}<br><small>${p.size} | ${p.fps} FPS</small>`;

    let delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.innerText = 'Delete';
    delBtn.onclick = (e) => {
      e.stopPropagation();
      deleteProject(p.id, p.name);
    };

    label.appendChild(infoWrapper);
    label.appendChild(delBtn);
    card.appendChild(label);
    box.appendChild(card);
  });
}

function deleteProject(id, name) {
  if (confirm(`Are you sure you want to delete "${name}"? This cannot be undone.`)) {
    projects = projects.filter(x => x.id !== id);
    localStorage.setItem('animix_projects_list', JSON.stringify(projects));
    renderProjects();
  }
}

function openProject(id) {
  let p = projects.find(x => x.id === id);
  if (!p) return;

  localStorage.setItem('animix-active-id', p.id);
  localStorage.setItem('animix-active-name', p.name);
  localStorage.setItem('animix-active-fps', p.fps);
  localStorage.setItem('animix-active-size', p.size);

  window.location.href = "project.html";
}

function importAniFile(e) {
  let file = e.target.files[0];
  if (!file) return;

  let reader = new FileReader();
  reader.onload = function(ev) {
    try {
      let project = JSON.parse(ev.target.result);
      projects.push(project);
      localStorage.setItem('animix_projects_list', JSON.stringify(projects));
      renderProjects();
      alert('Project Imported!');
    } catch {
      alert('Invalid .ani file');
    }
  };
  reader.readAsText(file);
}

window.onclick = function(e) {
  if (e.target.classList.contains('modal')) {
    closeModal(e.target.id);
  }
};
</script>

</body>
</html>
